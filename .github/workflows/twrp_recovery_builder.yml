name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-14.1

permissions:
  contents: read

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses6 \
            libncurses-dev libsdl1.2-dev libssl-dev libwxgtk3.2-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Initialize latest TWRP 14.1 source
        run: |
          mkdir -p workspace
          cd workspace
          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Sync source
        run: |
          cd workspace
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Record exact source revisions
        run: |
          cd workspace
          repo manifest -r -o twrp-manifest-pinned.xml
          {
            echo "minimal-manifest-twrp/platform_manifest_twrp_aosp twrp-14.1: $(git -C .repo/manifests rev-parse HEAD)"
            echo "TeamWin/android_bootable_recovery android-14.1: $(git -C bootable/recovery rev-parse HEAD)"
            echo "TeamWin/android_build android-14.1: $(git -C build/make rev-parse HEAD)"
            echo "TeamWin/android_build_soong android-14.1: $(git -C build/soong rev-parse HEAD)"
            echo "TeamWin/android_system_vold android-14.1: $(git -C system/vold rev-parse HEAD)"
            echo "TeamWin/android_vendor_twrp android-14.1: $(git -C vendor/twrp rev-parse HEAD)"
          } | tee twrp-source-pins.txt

      - name: Remove repo metadata
        run: rm -rf workspace/.repo

      - name: Link device tree
        run: |
          mkdir -p workspace/device/realme/samurai
          rsync -a \
            --exclude 'workspace' \
            --exclude '.git' \
            ./ workspace/device/realme/samurai/

      - name: Bootstrap current prebuilt checksums
        run: |
          cd workspace/device/realme/samurai/prebuilt
          if [[ ! -s SHA256SUMS ]]; then
            sha256sum Image.gz-dtb dtbo.img > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Build and validate recovery
        env:
          USE_CCACHE: 1
          CCACHE_DIR: ~/.ccache
        run: |
          cd workspace
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 10G
          ccache -z
          bash device/realme/samurai/build.sh
          ccache -s

      - name: Collect validation artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -f workspace/twrp-manifest-pinned.xml artifacts/ 2>/dev/null || true
          cp -f workspace/twrp-source-pins.txt artifacts/ 2>/dev/null || true
          cp -f workspace/device/realme/samurai/prebuilt/SHA256SUMS artifacts/prebuilt-SHA256SUMS 2>/dev/null || true
          cp -f workspace/out/build-logs/twrp_samurai_*.log artifacts/ 2>/dev/null || true

          if [[ -f workspace/out/target/product/samurai/recovery.img ]]; then
            cp workspace/out/target/product/samurai/recovery.img artifacts/recovery.img
            sha256sum artifacts/recovery.img > artifacts/recovery-SHA256SUMS
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-14.1-samurai-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
